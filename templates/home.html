<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 40px 20px; }
    h1 { font-size: 48px; font-weight: 700; margin-bottom: 8px; color: #111; }
    p { font-size: 18px; color: #666; margin-bottom: 40px; }
    form { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    input[type="text"] {
      padding: 14px 20px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 320px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #333; }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Job Search</h1>
    <p>키워드로 채용공고를 검색하세요</p>
    <form action="/search" method="get">
      <input
        type="text"
        name="keyword"
        placeholder="python, javascript, java..."
        required
      />
      <button type="submit">검색</button>
    </form>
  </div>
</body>
</html>
