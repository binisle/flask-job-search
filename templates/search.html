<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검색 결과 - {{ keyword }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      text-decoration: none;
    }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      padding: 10px 16px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      width: 240px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #333; }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .main { padding: 40px; max-width: 1100px; margin: 0 auto; }
    .meta { font-size: 14px; color: #666; margin-bottom: 24px; }
    .meta strong { color: #111; }
    table {
      width: 100%;
      background: white;
      border-radius: 10px;
      border-collapse: collapse;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    th {
      text-align: left;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    td {
      padding: 16px 20px;
      font-size: 14px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
      line-height: 1.5;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .position { font-weight: 600; color: #111; }
    .company { color: #555; }
    .description { color: #777; max-width: 400px; }
    td a {
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
    }
    td a:hover { text-decoration: underline; }
    .empty {
      text-align: center;
      padding: 60px;
      color: #888;
      font-size: 16px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">🔍 Job Search</a>
    <form action="/search" method="get">
      <input type="text" name="keyword" value="{{ keyword }}" />
      <button type="submit">검색</button>
    </form>
  </header>

  <div class="main">
    <p class="meta">
      "<strong>{{ keyword }}</strong>" 검색 결과 —
      <strong>{{ results|length }}</strong>개
    </p>

    {% if results %}
    <table>
      <thead>
        <tr>
          <th>포지션</th>
          <th>회사명</th>
          <th>상세정보</th>
          <th>링크</th>
        </tr>
      </thead>
      <tbody>
        {% for job in results %}
        <tr>
          <td class="position">{{ job.title }}</td>
          <td class="company">{{ job.company_name }}</td>
          <td class="description">{{ job.description }}</td>
          <td><a href="{{ job.link }}" target="_blank">지원하기 →</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <div class="empty">
      "<strong>{{ keyword }}</strong>"에 대한 채용공고가 없어요.
    </div>
    {% endif %}
  </div>
</body>
</html>
